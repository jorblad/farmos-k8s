apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: farmos-db
  namespace: farmos
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  # Bootstrap recovery referencing the corrected external cluster name
  bootstrap:
    recovery:
      source: farmos-db

  # Match the external cluster name to the original server name in S3
  externalClusters:
  - name: farmos-db
    barmanObjectStore:
      destinationPath: "s3://cnpg/farmos-db/"
      endpointURL: "http://192.168.210.30:30188"
      s3Credentials:
        accessKeyId:
          name: garage-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: garage-s3-creds
          key: ACCESS_SECRET_KEY
        region:
          name: garage-s3-creds
          key: AWS_REGION
      wal:
        compression: gzip
        maxParallel: 2

  backup:
    barmanObjectStore:
      destinationPath: "s3://cnpg/farmos-db-v18/"
      endpointURL: "http://192.168.210.30:30188"
      s3Credentials:
        accessKeyId:
          name: garage-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: garage-s3-creds
          key: ACCESS_SECRET_KEY
          region:
            name: garage-s3-creds
            key: AWS_REGION
      wal:
        compression: gzip
        maxParallel: 2

  env:
  - name: AWS_REQUEST_CHECKSUM_CALCULATION
    value: when_required
  - name: AWS_RESPONSE_CHECKSUM_VALIDATION
    value: when_required
  enableSuperuserAccess: true
  managed:
    roles:
    - name: farmos
      superuser: true
      login: true
    - name: app
      superuser: true
      login: true
  storage:
    pvcTemplate:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: longhorn
  monitoring:
    enablePodMonitor: true
  primaryUpdateStrategy: unsupervised
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: farmos-db-daily-backup
  namespace: farmos
spec:
  schedule: "0 0 2 * * *"
  cluster:
    name: farmos-db
